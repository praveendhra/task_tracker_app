plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing comes from environment variables (set by CI from GitHub
// secrets) or an untracked android/key.properties for local builds. Nothing
// secret is committed. Without either, release builds use the debug key so
// `flutter build` still works for testing.
def keyProps = new Properties()
def keyPropsFile = rootProject.file('key.properties')
if (keyPropsFile.exists()) {
    keyPropsFile.withReader('UTF-8') { keyProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keyProps.getProperty(propName)
}
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace "com.pravii_corp.task_tracker"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.pravii_corp.task_tracker"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
