name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test & build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build web (production)
        run: flutter build web --release --base-href /

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 14

  screenshots:
    name: Demo screenshots
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build web (demo data, no Firebase)
        run: flutter build web --release --base-href / --dart-define=DEMO=true -o build/demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture screenshots
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          (cd build/demo && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node tool/screenshots.mjs http://localhost:8080 screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

  deploy:
    name: Deploy to task.praveendhra.com
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Push build to task_tracker_live
        env:
          TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::LIVE_REPO_TOKEN is not set, skipping deploy. See README."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/praveendhra/task_tracker_live.git" live
          cd live
          # Keep repo metadata and the custom domain; replace the rest.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name CNAME ! -name README.md -exec rm -rf {} +
          cp -R ../web/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy ${GITHUB_SHA::7} from task_tracker_app"
          git push origin HEAD:main
