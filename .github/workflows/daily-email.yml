name: Daily email

# Each user gets one email a day at their chosen local hour. GitHub often
# skips or delays scheduled runs, so this checks every 15 minutes (at odd
# minutes, away from the busy top of the hour); the script sends at most
# once per user per day, so extra runs are harmless.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Send now to this account (email address), ignoring the hour'
        required: false
      dry_run:
        description: 'Only log what would be sent'
        type: boolean
        default: false

concurrency:
  group: daily-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tool/daily_email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'Task Tracker <tasks@mail.praveendhra.com>' }}
          APP_URL: https://task.praveendhra.com
          FORCE_EMAIL: ${{ inputs.force_email }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
