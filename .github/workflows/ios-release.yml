name: iOS release

# Signs the app with an App Store Connect API key and uploads it to
# TestFlight. Run it from Actions → iOS release → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUNDLE_ID: com.pravii.taskTrackerApp
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds made with the latest Xcode SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets
        run: |
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set. See store/RELEASE.md."; exit 1; fi
          done

      - name: Install Codemagic CLI tools
        run: pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Fetch or create signing certificate and profile
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

      - run: flutter pub get
      - name: Apply profiles to the Xcode project
        run: xcode-project use-profiles

      - name: Build IPA
        run: |
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          set -o pipefail
          flutter build ipa --release --build-name=1.0.0 --build-number=$BUILD \
            --export-options-plist="$HOME/export_options.plist" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)" 2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Publish log to ci-release-logs branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          # Copy logs with anything key-like stripped out.
          for f in "$RUNNER_TEMP"/*.log; do [ -f "$f" ] && grep -v -E 'PRIVATE KEY|[A-Za-z0-9+/=]{40,}' "$f" > "$(basename "$f")"; done || true
          git init -q -b ci-release-logs
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "logs ${GITHUB_SHA::7}" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-release-logs-${{ github.workflow == 'iOS release' && 'ios' || 'listing' }}

      - name: Clean up keychain
        if: always()
        run: keychain use-login || true
